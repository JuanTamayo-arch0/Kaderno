<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Kaderno</title>
    <meta name="description" content="Tareas, apuntes, horario y estudio en un solo lugar." />
    <meta name="theme-color" content="#0f1115" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaderno" />
    <!-- Configuración de Supabase leída en tiempo de ejecución.
         Se puede editar en el servidor sin recompilar la app. -->
    <script src="/kaderno-config.js"></script>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      /* El anillo de foco solo aparece al usar el teclado. */
      :focus:not(:focus-visible) { outline: none; }
    </style>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar Kaderno.</noscript>
    <div id="root"></div>
  </body>
