# =====================================================================
#  Kaderno · calendario por el dominio propio (opcional, recomendado)
#
#  Pega este bloque DENTRO del bloque `server { ... }` HTTPS de Kaderno
#  (el que tiene `listen 443 ssl`), ANTES de otros `location ~ ...`.
#  Cambia TU-PROYECTO y TU-ANON-KEY (Supabase, Project Settings, API).
#  La anon key es pública (ya está en kaderno-config.js); la service role
#  key NUNCA va aquí.
#
#  Resultado: https://tu-dominio/calendario/<token>.ics
#    · Certificado de tu dominio (el mismo de la app).
#    · Funciona aunque la función "ical" tenga la verificación JWT activa,
#      porque Nginx le agrega la llave pública.
#
#  Después:  sudo nginx -t && sudo systemctl reload nginx
#  Y en kaderno-config.js:  CALENDAR_URL: 'https://tu-dominio/calendario',
# =====================================================================

location ~ ^/calendario/(?<kcal_token>[a-f0-9]{40,80})\.ics$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $kcal_host "TU-PROYECTO.supabase.co";

    proxy_pass https://$kcal_host/functions/v1/ical?token=$kcal_token;
    proxy_set_header Host $kcal_host;
    proxy_set_header apikey "TU-ANON-KEY";
    proxy_set_header Authorization "Bearer TU-ANON-KEY";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name $kcal_host;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
