# =====================================================================
#  Kaderno · Nginx más rápido (compresión y caché)
#
#  Pega esto DENTRO del bloque `server { ... }` HTTPS de Kaderno.
#  Después:  sudo nginx -t && sudo systemctl reload nginx
#
#  Por qué: en Ubuntu, Nginx trae `gzip on` pero solo comprime HTML. El
#  JavaScript de Kaderno (unos 2 MB) viaja entero si no se agrega gzip_types;
#  comprimido pesa cerca de 600 KB. Y los archivos del build llevan una huella
#  en el nombre, así que se pueden guardar un año sin riesgo.
#
#  Ojo con `add_header`: si tu bloque server ya tiene encabezados de seguridad
#  (HSTS, etc.), Nginx NO los hereda dentro de un `location` que tenga su
#  propio add_header. Si es tu caso, copia también esas líneas aquí dentro.
# =====================================================================

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/manifest+json image/svg+xml font/ttf application/x-font-ttf text/calendar;

# Archivos del build con huella en el nombre: caché de un año.
# Si un archivo no existe se responde 404 (no la página de la app), así una
# pestaña vieja lo detecta y se recarga sola.
location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Siempre frescos (junto con los de la versión 12: sw.js, manifest, index.html, kaderno-config.js).
location = /precache.json { add_header Cache-Control "no-cache"; }
